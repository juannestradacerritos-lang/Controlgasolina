<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Combustible</title>
    <meta name="theme-color" content="#1e293b">
    
    <!-- Manifest incrustado directamente para la PWA -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Control de Combustible","short_name":"Combustible","start_url":".","display":"standalone","background_color":"#f1f5f9","theme_color":"#1e293b","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3063/3063189.png","sizes":"512x512","type":"image/png"}]}'>
    
    <!-- Tipografía e Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Librerías Externas para OCR y Gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Diseño Corporativo / Ejecutivo */
        :root { 
            --bg-body: #f1f5f9; 
            --bg-surface: #ffffff; 
            --text-dark: #0f172a; 
            --text-muted: #64748b; 
            --primary: #1e293b;
            --primary-hover: #334155;
            --accent: #2563eb; 
            --accent-hover: #1d4ed8;
            --success: #0f766e; 
            --success-hover: #115e59;
            --danger: #ef4444;
            --border: #e2e8f0; 
            --radius: 8px; 
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-dark); margin: 0; padding: 0 0 50px; -webkit-font-smoothing: antialiased; }
        
        .app-header { background-color: var(--primary); color: white; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); position: sticky; top: 0; z-index: 10; border-bottom: 3px solid var(--accent); }
        .app-header-left { display: flex; align-items: center; gap: 12px; }
        .app-header-left i { font-size: 1.5rem; color: #93c5fd; }
        .app-header-left h1 { margin: 0; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; }
        
        .cloud-status { display: flex; flex-direction: column; align-items: flex-end; font-size: 0.7rem; font-weight: 600; color: #94a3b8; }
        .cloud-status i { font-size: 1.2rem; margin-top: 2px; }

        .container { max-width: 850px; margin: 24px auto; padding: 0 16px; }
        
        .card { background: var(--bg-surface); padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid var(--border); }
        .card h2 { color: var(--text-dark); margin-top: 0; font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.05em; }
        .card h2 i { color: var(--accent); }
        
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        input, select { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; color: var(--text-dark); background-color: #f8fafc; box-sizing: border-box; transition: all 0.2s; }
        input:focus, select:focus { border-color: var(--accent); outline: none; background-color: var(--bg-surface); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        select { cursor: pointer; appearance: none; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 12px top 50%; background-size: 10px auto; }
        
        button { width: 100%; padding: 12px 16px; border: none; border-radius: 6px; color: white; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: all 0.2s; }
        button:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--accent); }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: var(--success-hover); }
        .btn-secondary { background-color: var(--primary); }
        .btn-secondary:hover { background-color: var(--primary-hover); }
        
        .btn-outline { background-color: transparent; border: 1px solid #cbd5e1; color: var(--text-dark); width: auto; padding: 8px 14px; font-size: 0.8rem; }
        .btn-outline:hover { background-color: #f1f5f9; border-color: #94a3b8; }
        .btn-icon-danger { background-color: transparent; color: var(--danger); font-size: 1rem; padding: 6px; width: auto; border-radius: 4px; }
        .btn-icon-danger:hover { background-color: #fef2f2; }
        .btn-icon-action { background-color: transparent; font-size: 1rem; padding: 6px; width: auto; border-radius: 4px; transition: all 0.2s; }
        .btn-icon-action:hover { background-color: #f1f5f9; }

        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        
        .alert-box { background: #f0fdfa; border-left: 4px solid var(--success); padding: 16px; border-radius: 4px; margin-top: 20px; font-size: 0.9rem; color: #134e4a; display: none; line-height: 1.5; }
        
        .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 950px; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #f8fafc; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.05em; }
        tbody tr:hover { background-color: #f8fafc; }
        .badge { background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem; border: 1px solid #bae6fd; }
        
        .badge-regular { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 3px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
        .badge-super { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; padding: 3px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .modal-content { background: white; padding: 32px; border-radius: 8px; width: 90%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .modal-content h3 { margin-top: 0; color: var(--text-dark); display: flex; align-items: center; gap: 8px; font-size: 1.2rem; }
        .modal-content p { font-size: 0.95rem; color: var(--text-muted); line-height: 1.6; }

        @media print {
            @page { size: landscape; margin: 10mm; } 
            body { background: white !important; padding: 0 !important; color: black !important; }
            .card { box-shadow: none !important; border: none !important; margin: 0 !important; padding: 0 !important; }
            .card:nth-child(1), .card:nth-child(2), .card:nth-child(3), .app-header { display: none !important; }
            .card h2, .grid-2, button, .btn-icon-action, .btn-icon-danger { display: none !important; }
            
            .table-wrapper { overflow: visible !important; border: none !important; }
            .table-wrapper::before { content: "Reporte de Rendimiento - Control de Flotilla"; font-size: 14pt; font-weight: bold; display: block; margin-bottom: 10px; color: black; text-transform: uppercase; border-bottom: 2px solid black; padding-bottom: 5px; }
            
            table { border: 1px solid black !important; min-width: 100% !important; font-size: 8pt !important; width: 100% !important; table-layout: auto; }
            th, td { border: 1px solid black !important; color: black !important; padding: 6px 4px !important; text-align: center !important; }
            th { background-color: #f1f5f9 !important; font-size: 7.5pt !important; -webkit-print-color-adjust: exact; color-adjust: exact; }
            
            .badge, .badge-regular, .badge-super { background: transparent !important; color: black !important; border: none !important; padding: 0 !important; font-weight: bold !important; text-transform: none; }
            th:last-child, td:last-child { display: none !important; }
        }
    </style>
</head>
<body>

<header class="app-header">
    <div class="app-header-left">
        <i class="fas fa-gas-pump"></i>
        <h1>Control de Flotilla</h1>
    </div>
    <!-- Indicador de Nube -->
    <div class="cloud-status">
        <span id="textNube">Conectando...</span>
        <i id="iconNube" class="fas fa-cloud"></i>
    </div>
</header>

<div class="container">
    
    <!-- Calculadora Inteligente de Proyección -->
    <div class="card">
        <h2><i class="fas fa-calculator"></i> Calculadora y Proyección</h2>
        
        <div class="grid-2">
            <div class="input-group">
                <label>Precio del Galón (Q)</label>
                <input type="number" id="projPrecio" placeholder="Ej. 38.57">
            </div>
            <div class="input-group">
                <label>Capacidad del Tanque (Gal)</label>
                <input type="number" id="projTanque" value="2.7" placeholder="Ej. 2.7">
            </div>
        </div>
        
        <div class="grid-2">
            <div class="input-group">
                <label>Km Recorrer</label>
                <input type="number" id="projKM" placeholder="Ej. 150">
            </div>
            <div class="input-group">
                <label>Calculo a Cargar (Q)</label>
                <input type="number" id="projMonto" placeholder="Ej. 10.00">
            </div>
        </div>
        
        <button class="btn-secondary" id="btnCalcular"><i class="fas fa-bolt"></i> Calcular Estimación</button>
        <div id="resultadoProyeccion" class="alert-box" style="border-left-color: var(--accent); background: #eff6ff; color: #1e3a8a;"></div>
    </div>

    <!-- Registro y OCR -->
    <div class="card">
        <div class="header-actions">
            <h2><i class="fas fa-file-invoice-dollar"></i> Registro de Carga Oficial</h2>
            <div style="text-align: right;">
                <button class="btn-outline" id="btnOCR"><i class="fas fa-camera"></i> Escanear Factura</button>
                <input type="file" id="inputFactura" accept="image/*" capture="environment" style="display: none;">
                <div id="ocrStatus" style="display: none; font-size: 0.7rem; color: var(--accent); margin-top: 8px; font-weight: 600;"></div>
            </div>
        </div>
        
        <div class="input-group">
            <label>Referencia / Documento / Fecha</label>
            <input type="text" id="f" placeholder="Ej. Factura #12345">
        </div>
        <div class="grid-2">
            <div class="input-group">
                <label>Odómetro Inicial</label>
                <input type="number" id="ki" placeholder="Ej. 5000">
            </div>
            <div class="input-group">
                <label>Odómetro Final</label>
                <input type="number" id="kf" placeholder="Ej. 5200">
            </div>
        </div>
        
        <div class="grid-2">
            <div class="input-group">
                <label>CANT. Galones</label>
                <input type="number" id="gal" step="0.001" placeholder="Ej. 1.738">
            </div>
            <div class="input-group">
                <label>Precio/Galón (Q)</label>
                <input type="number" id="precio" step="0.01" placeholder="Ej. 38.57">
            </div>
        </div>
        
        <div class="grid-2">
            <div class="input-group">
                <label>Tipo de Combustible</label>
                <select id="tipoComb">
                    <option value="Regular">Regular</option>
                    <option value="Súper">Súper</option>
                </select>
            </div>
            <div class="input-group">
                <label>Monto Total Facturado (Q)</label>
                <input type="number" id="costo" step="0.01" placeholder="Ej. 67.03">
            </div>
        </div>
        
        <button class="btn-success" id="btnGuardar" style="margin-top: 10px;"><i class="fas fa-cloud-upload-alt"></i> Guardar en la Nube</button>
    </div>

    <!-- Gráfica de Rendimiento -->
    <div class="card">
        <h2><i class="fas fa-chart-line"></i> Análisis de Rendimiento Histórico</h2>
        <canvas id="chartRendimiento" height="90"></canvas>
    </div>

    <!-- Historial y Backup -->
    <div class="card">
        <h2><i class="fas fa-table"></i> Base de Datos Histórica</h2>
        
        <div class="grid-2" style="margin-bottom: 16px;">
            <button class="btn-outline" id="btnBackup"><i class="fas fa-download"></i> Guardar Copia Local</button>
            <button class="btn-outline" onclick="document.getElementById('inputRestore').click()"><i class="fas fa-upload"></i> Restaurar Copia Local</button>
            <input type="file" id="inputRestore" accept=".json" style="display: none;">
        </div>

        <div class="table-wrapper">
            <table id="tablaHistorial">
                <thead>
                    <tr>
                        <th>Ref.</th>
                        <th>Tipo</th>
                        <th>Odo. Inic.</th>
                        <th>Odo. Fin.</th>
                        <th>Distancia</th>
                        <th>Galones</th>
                        <th>Prec/Gal(Q)</th>
                        <th>Total(Q)</th>
                        <th>Eficiencia</th>
                        <th>Costo/KM</th>
                        <th style="text-align: center; min-width: 140px;">Acción</th>
                    </tr>
                </thead>
                <tbody id="bodyHistorial">
                    <!-- Registros inyectados por JS -->
                </tbody>
            </table>
        </div>
        <div class="grid-2" style="margin-top: 24px;">
            <button class="btn-outline" id="btnExportarPDF"><i class="fas fa-file-pdf"></i> Generar Reporte PDF</button>
            <button class="btn-primary" id="btnExportarCSV"><i class="fas fa-file-excel"></i> Exportar a CSV (Excel)</button>
        </div>
    </div>
</div>

<!-- Modal Corporativo -->
<div id="ventanaResumen" class="modal-overlay">
    <div class="modal-content">
        <h3 style="color: var(--success);"><i class="fas fa-check-circle"></i> Transacción Exitosa</h3>
        <p id="textoResumen"></p>
        <button class="btn-secondary" onclick="document.getElementById('ventanaResumen').style.display='none'" style="margin-top: 24px;">Aceptar y Continuar</button>
    </div>
</div>

<script>
    // ==========================================
    // CONFIGURACIÓN DE FIREBASE (LA NUBE)
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyC4usCsv7vxYrqd_R3GefHecy1ZgPFivjU",
        authDomain: "controlcilco.firebaseapp.com",
        databaseURL: "https://controlcilco-default-rtdb.firebaseio.com",
        projectId: "controlcilco",
        storageBucket: "controlcilco.firebasestorage.app",
        messagingSenderId: "952205287411",
        appId: "1:952205287411:web:c69e678f0830318bf8bc86",
        measurementId: "G-7311KL7GTK"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    // Variables Globales
    let historialArray = JSON.parse(localStorage.getItem('gasolinaHistorial')) || [];
    let chartInstance = null;
    let idEditando = null;

    // --- BORRADOR AUTOMÁTICO (PROTECCIÓN ANTI-CIERRE) ---
    const camposBorrador = ['projPrecio', 'projTanque', 'projKM', 'projMonto', 'f', 'ki', 'kf', 'gal', 'precio', 'tipoComb', 'costo'];
    
    function guardarBorrador() {
        const borrador = {};
        camposBorrador.forEach(id => {
            const el = document.getElementById(id);
            if (el) borrador[id] = el.value;
        });
        localStorage.setItem('flotillaBorrador', JSON.stringify(borrador));
    }

    camposBorrador.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.addEventListener('input', guardarBorrador);
            el.addEventListener('change', guardarBorrador);
        }
    });

    // --- MONITOREO DE CONEXIÓN A LA NUBE ---
    database.ref('.info/connected').on('value', function(snap) {
        const iconNube = document.getElementById('iconNube');
        const textNube = document.getElementById('textNube');
        if (snap.val() === true) {
            iconNube.style.color = '#10b981';
            textNube.innerText = 'Online';
        } else {
            iconNube.style.color = '#ef4444'; 
            textNube.innerText = 'Offline';
        }
    });

    database.ref('FlotillaApp/Historial').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            historialArray = data;
            localStorage.setItem('gasolinaHistorial', JSON.stringify(historialArray));
            if (historialArray.length > 0) {
                localStorage.setItem('kmMotoGuardado', historialArray[0].kf);
            }
            renderizarTabla();
            actualizarGrafica();
        }
    });

    function sincronizarNube() {
        // Enviar a la nube. Si no hay internet, Firebase lo pone en cola y lo envía apenas se conecte.
        database.ref('FlotillaApp/Historial').set(historialArray);
        const km = localStorage.getItem('kmMotoGuardado');
        if(km) database.ref('FlotillaApp/Config/UltimoKM').set(km);
    }

    // --- AUTOCOMPLETADO MATEMÁTICO ---
    const inGal = document.getElementById('gal');
    const inPre = document.getElementById('precio');
    const inCos = document.getElementById('costo');

    inGal.addEventListener('input', () => {
        const gal = parseFloat(inGal.value);
        const pre = parseFloat(inPre.value);
        if(!isNaN(gal) && !isNaN(pre)) {
            inCos.value = (gal * pre).toFixed(2);
            guardarBorrador();
        }
    });
    inPre.addEventListener('input', () => {
        const gal = parseFloat(inGal.value);
        const pre = parseFloat(inPre.value);
        const cos = parseFloat(inCos.value);
        if(!isNaN(pre) && !isNaN(cos) && isNaN(gal)) {
            inGal.value = (cos / pre).toFixed(3);
            guardarBorrador();
        } else if(!isNaN(pre) && !isNaN(gal)) {
            inCos.value = (gal * pre).toFixed(2);
            guardarBorrador();
        }
    });
    inCos.addEventListener('input', () => {
        const cos = parseFloat(inCos.value);
        const pre = parseFloat(inPre.value);
        if(!isNaN(cos) && !isNaN(pre) && pre > 0) {
            inGal.value = (cos / pre).toFixed(3);
            guardarBorrador();
        }
    });

    window.addEventListener('load', () => {
        const ultimoKM = localStorage.getItem('kmMotoGuardado');
        if (ultimoKM) document.getElementById('ki').value = ultimoKM;
        
        database.ref('FlotillaApp/Config/CapacidadTanque').once('value').then((snap) => {
            const tk = snap.val() || localStorage.getItem('capacidadTanque') || 2.7;
            document.getElementById('projTanque').value = tk;
        });

        // Restaurar el borrador automático si existe
        const borrador = JSON.parse(localStorage.getItem('flotillaBorrador'));
        if (borrador) {
            camposBorrador.forEach(id => {
                if (borrador[id] !== undefined && borrador[id] !== "") {
                    document.getElementById(id).value = borrador[id];
                }
            });
        } else {
            const fechaHoy = new Date().toLocaleDateString('es-ES', { year: 'numeric', month: '2-digit', day: '2-digit' });
            document.getElementById('f').value = `Reg: ${fechaHoy}`;
        }
        
        renderizarTabla();
        actualizarGrafica();
    });

    // --- OCR ESCÁNER ---
    document.getElementById('btnOCR').addEventListener('click', () => document.getElementById('inputFactura').click());
    
    document.getElementById('inputFactura').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const status = document.getElementById('ocrStatus');
        status.style.display = 'block';
        status.style.color = '#2563eb';
        status.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Leyendo factura...';

        try {
            const result = await Tesseract.recognize(file, 'spa');
            const texto = result.data.text.toLowerCase();

            if (texto.includes('regular')) document.getElementById('tipoComb').value = 'Regular';
            if (texto.includes('super') || texto.includes('súper')) document.getElementById('tipoComb').value = 'Súper';

            const regexLineaGasolinera = /([\d]+[\.,][\d]{3})\s+.*?(?:regular|s[uú]per|diesel|v-power).*?\s+([\d]+[\.,][\d]{2})\s+([\d]+[\.,][\d]{2})/i;
            const matchLinea = texto.match(regexLineaGasolinera);

            if (matchLinea) {
                document.getElementById('gal').value = matchLinea[1].replace(',', '.');
                document.getElementById('precio').value = matchLinea[2].replace(',', '.');
                document.getElementById('costo').value = matchLinea[3].replace(',', '.');
            } else {
                const match3Dec = texto.match(/(\d+[\.,]\d{3})/);
                if (match3Dec) {
                    document.getElementById('gal').value = match3Dec[1].replace(',', '.');
                } else {
                    const matchGalFallback = texto.match(/(?:cant|cantidad|gal|galones)[\s\S]{0,15}?([\d]+[\.,][\d]{2,3})/i);
                    if (matchGalFallback) document.getElementById('gal').value = matchGalFallback[1].replace(',', '.');
                }

                const matchCosto = texto.match(/(?:total|q\.|valor)[\s\S]{0,15}?([\d]+[\.,][\d]{2})/i);
                if (matchCosto) document.getElementById('costo').value = matchCosto[1].replace(',', '.');

                const matchPrecio = texto.match(/(?:precio|prec)[\s\S]{0,15}?([\d]+[\.,][\d]{2})/i);
                if (matchPrecio) document.getElementById('precio').value = matchPrecio[1].replace(',', '.');
            }

            inGal.dispatchEvent(new Event('input'));
            guardarBorrador();

            status.style.color = '#0f766e';
            status.innerHTML = '<i class="fas fa-check"></i> Extracción exitosa. Verifique los números.';
            setTimeout(() => status.style.display = 'none', 6000);
        } catch (error) {
            status.style.color = '#ef4444';
            status.innerHTML = '<i class="fas fa-times"></i> Error de lectura. Ingrese manualmente.';
        }
    });

    // --- CALCULADORA DE PROYECCIÓN ---
    document.getElementById('btnCalcular').addEventListener('click', () => {
        const km = parseFloat(document.getElementById('projKM').value);
        const monto = parseFloat(document.getElementById('projMonto').value);
        const precio = parseFloat(document.getElementById('projPrecio').value);
        const capacidadTanque = parseFloat(document.getElementById('projTanque').value) || 2.7;
        const res = document.getElementById('resultadoProyeccion');
        
        if (!precio) return alert("Por favor ingresa el Precio del Galón (Q) para calcular.");

        localStorage.setItem('capacidadTanque', capacidadTanque);
        database.ref('FlotillaApp/Config/CapacidadTanque').set(capacidadTanque);

        let rendimientoPromedio = 110; 
        if (historialArray.length > 0) {
            const totalRecorrido = historialArray.reduce((acc, curr) => acc + parseFloat(curr.recorrido), 0);
            const totalGalones = historialArray.reduce((acc, curr) => acc + parseFloat(curr.gal), 0);
            if (totalGalones > 0) rendimientoPromedio = totalRecorrido / totalGalones;
        }

        let htmlRes = `<div style="font-size: 0.8rem; color: #64748b; margin-bottom: 12px; border-bottom: 1px solid #bfdbfe; padding-bottom: 8px;"><i class="fas fa-brain"></i> Usando rendimiento base: <b>${rendimientoPromedio.toFixed(1)} km/gal</b></div>`;
        let calculoHecho = false;

        if (km) {
            const galonesEstimados = km / rendimientoPromedio; 
            const costoEstimado = galonesEstimados * precio;
            const tanquesNecesarios = galonesEstimados / capacidadTanque;
            let textoTanque = "";
            
            if (tanquesNecesarios > 1) {
                const tanquesEnteros = Math.floor(tanquesNecesarios);
                const porcentajeSobrante = ((tanquesNecesarios - tanquesEnteros) * 100).toFixed(0);
                
                if (porcentajeSobrante == 0) {
                    textoTanque = `Necesitarás exactamente <b>${tanquesEnteros} tanques llenos</b> de tu vehículo.`;
                } else {
                    let textoS = tanquesEnteros === 1 ? '1 tanque lleno' : `${tanquesEnteros} tanques llenos`;
                    textoTanque = `Tendrás que recargar. Usarás <b>${textoS} y un ${porcentajeSobrante}% adicional</b>.`;
                }
            } else {
                const porcentajeTanque = (tanquesNecesarios * 100).toFixed(0);
                textoTanque = `Consumirás el <b>${porcentajeTanque}%</b> de tu tanque (No necesitas recargar).`;
            }
            
            htmlRes += `
                <div style="margin-bottom: 12px;">
                    Para <b>${km} km</b> necesitas <b>${galonesEstimados.toFixed(3)} galones</b>.<br>
                    <span style="font-size:0.75rem; color:#64748b; display: block; margin-top: 4px;"><i class="fas fa-motorcycle"></i> ${textoTanque}</span>
                    <strong style="color: #0f172a; display: block; margin-top: 10px;">Total a Cargar: Q${costoEstimado.toFixed(2)}</strong>
                </div>`;
            calculoHecho = true;
        }

        if (monto) {
            const galonesComprados = monto / precio;
            const kmEstimados = galonesComprados * rendimientoPromedio;
            
            htmlRes += `
                <div>
                    Con <b>Q${monto.toFixed(2)}</b> obtendrás <b>${galonesComprados.toFixed(3)} galones</b>.<br>
                    <strong style="color: #0f766e; display: block; margin-top: 4px;">Te alcanzará para recorrer: ${kmEstimados.toFixed(1)} km aprox.</strong>
                </div>`;
            calculoHecho = true;
        }

        if(calculoHecho) {
            res.style.display = 'block';
            res.innerHTML = htmlRes;
        } else {
            alert("Ingresa los Km Recorrer o el Calculo a Cargar para ver la estimación.");
        }
    });

    // --- GUARDAR O ACTUALIZAR REGISTRO ---
    document.getElementById('btnGuardar').addEventListener('click', () => {
        const fac = document.getElementById('f').value || '-';
        const tipoComb = document.getElementById('tipoComb').value;
        const ki = parseFloat(document.getElementById('ki').value);
        const kf = parseFloat(document.getElementById('kf').value);
        const gal = parseFloat(document.getElementById('gal').value);
        let costoVal = parseFloat(document.getElementById('costo').value);
        let precioVal = parseFloat(document.getElementById('precio').value);

        if (ki && kf && gal && (costoVal || precioVal) && kf > ki) {
            
            if(!precioVal || isNaN(precioVal)) precioVal = costoVal / gal;
            if(!costoVal || isNaN(costoVal)) costoVal = gal * precioVal;

            const recorrido = kf - ki;
            const rendimiento = recorrido / gal;
            const costoKm = costoVal / recorrido;

            const datosProcesados = {
                fac, tipoComb, ki, kf, recorrido, 
                gal: gal.toFixed(3), 
                precio: precioVal.toFixed(2),
                costo: costoVal.toFixed(2),
                rendimiento: rendimiento.toFixed(2), 
                costoKm: costoKm.toFixed(2)
            };

            if(idEditando) {
                const index = historialArray.findIndex(r => r.id === idEditando);
                if(index !== -1) {
                    historialArray[index] = { ...historialArray[index], ...datosProcesados };
                }
                idEditando = null;
                const btn = document.getElementById('btnGuardar');
                btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Guardar en la Nube';
                btn.classList.replace('btn-primary', 'btn-success');
                
                if (index === 0) localStorage.setItem('kmMotoGuardado', kf);
                
            } else {
                datosProcesados.id = Date.now();
                historialArray.unshift(datosProcesados);
                localStorage.setItem('kmMotoGuardado', kf);
            }

            localStorage.setItem('gasolinaHistorial', JSON.stringify(historialArray));
            sincronizarNube();

            // ¡IMPORTANTE! Limpiar el borrador porque ya se guardó la factura oficialmente
            localStorage.removeItem('flotillaBorrador');

            const kmMemoria = localStorage.getItem('kmMotoGuardado');
            document.getElementById('ki').value = kmMemoria || kf;
            document.getElementById('kf').value = '';
            document.getElementById('gal').value = '';
            document.getElementById('precio').value = '';
            document.getElementById('costo').value = '';
            
            renderizarTabla();
            actualizarGrafica();

            document.getElementById('textoResumen').innerHTML = `
                El registro se guardó de forma segura.<br><br>
                Gasolina: <b>${tipoComb}</b><br>
                Distancia Registrada: <b style="color:#0f172a;">${recorrido} km</b><br>
                Eficiencia: <b style="color:#0f172a;">${rendimiento.toFixed(2)} km/gal</b><br>
                Total Facturado: <b style="color:#0f766e;">Q${costoVal.toFixed(2)}</b>
            `;
            document.getElementById('ventanaResumen').style.display = 'flex';
        } else {
            alert("Validación fallida: Asegúrese de llenar los campos y que el Odómetro Final sea mayor al Inicial.");
        }
    });

    // --- ACCIONES DE LA TABLA ---
    window.moverRegistro = function(index, direccion) {
        if (direccion === -1 && index > 0) { 
            const temp = historialArray[index];
            historialArray[index] = historialArray[index - 1];
            historialArray[index - 1] = temp;
        } else if (direccion === 1 && index < historialArray.length - 1) { 
            const temp = historialArray[index];
            historialArray[index] = historialArray[index + 1];
            historialArray[index + 1] = temp;
        }
        localStorage.setItem('gasolinaHistorial', JSON.stringify(historialArray));
        sincronizarNube();
        renderizarTabla();
    };

    window.editarRegistro = function(id) {
        const reg = historialArray.find(r => r.id === id);
        if(!reg) return;
        
        document.getElementById('f').value = reg.fac;
        document.getElementById('tipoComb').value = reg.tipoComb || 'Regular';
        document.getElementById('ki').value = reg.ki;
        document.getElementById('kf').value = reg.kf;
        document.getElementById('gal').value = reg.gal;
        document.getElementById('precio').value = reg.precio || '';
        
        const costoPrecargado = reg.costo ? reg.costo : (reg.precio ? (parseFloat(reg.gal) * parseFloat(reg.precio)).toFixed(2) : '');
        document.getElementById('costo').value = costoPrecargado;

        idEditando = id;
        guardarBorrador(); 
        
        const btn = document.getElementById('btnGuardar');
        btn.innerHTML = '<i class="fas fa-edit"></i> Actualizar en la Nube';
        btn.classList.replace('btn-success', 'btn-primary');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function renderizarTabla() {
        const tbody = document.getElementById('bodyHistorial');
        tbody.innerHTML = '';
        historialArray.forEach((reg, index) => {
            const precioMostrado = reg.precio ? `Q${reg.precio}` : '-'; 
            const costoMostrado = reg.costo ? `Q${reg.costo}` : `Q${(parseFloat(reg.gal) * parseFloat(reg.precio||0)).toFixed(2)}`;
            const claseBadgeTipo = reg.tipoComb === 'Súper' ? 'badge-super' : 'badge-regular';
            const tipoCombTexto = reg.tipoComb || 'Regular';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${reg.fac}</strong></td>
                <td><span class="${claseBadgeTipo}">${tipoCombTexto}</span></td>
                <td>${reg.ki}</td>
                <td>${reg.kf}</td>
                <td>${reg.recorrido} km</td>
                <td>${reg.gal}</td>
                <td>${precioMostrado}</td>
                <td><strong>${costoMostrado}</strong></td>
                <td>${reg.rendimiento}</td>
                <td><span class="badge">Q${reg.costoKm}</span></td>
                <td style="text-align: center; white-space: nowrap;">
                    <button class="btn-icon-action" style="color: #2563eb;" onclick="editarRegistro(${reg.id})" title="Editar"><i class="fas fa-pen"></i></button>
                    <button class="btn-icon-action" style="color: #64748b;" onclick="moverRegistro(${index}, -1)" title="Mover Arriba"><i class="fas fa-arrow-up"></i></button>
                    <button class="btn-icon-action" style="color: #64748b;" onclick="moverRegistro(${index}, 1)" title="Mover Abajo"><i class="fas fa-arrow-down"></i></button>
                    <button class="btn-icon-action" style="color: #ef4444;" onclick="borrarRegistro(${reg.id})" title="Eliminar"><i class="fas fa-trash"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.borrarRegistro = function(id) {
        if(confirm("¿Confirma la eliminación de este registro? (Se borrará de la nube)")) {
            historialArray = historialArray.filter(reg => reg.id !== id);
            localStorage.setItem('gasolinaHistorial', JSON.stringify(historialArray));
            sincronizarNube();
            renderizarTabla();
            actualizarGrafica();
        }
    };

    function actualizarGrafica() {
        const ctx = document.getElementById('chartRendimiento').getContext('2d');
        const datosGrafica = [...historialArray].slice(0, 10).reverse();
        const labels = datosGrafica.map(r => r.fac.substring(0, 10));
        const data = datosGrafica.map(r => parseFloat(r.rendimiento));

        if(chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Eficiencia (km/gal)',
                    data: data,
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4,
                    pointBackgroundColor: '#1e293b',
                    pointRadius: 4
                }]
            },
            options: { 
                responsive: true, 
                plugins: { legend: { display: false } },
                scales: { 
                    y: { beginAtZero: false, grid: { color: '#e2e8f0' } },
                    x: { grid: { display: false } }
                }
            }
        });
    }

    // --- COPIAS DE SEGURIDAD LOCALES ---
    document.getElementById('btnBackup').addEventListener('click', () => {
        if(historialArray.length === 0) return alert("No hay datos para respaldar.");
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(historialArray));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        dlAnchorElem.setAttribute("download", "Backup_Gasolina.json");
        dlAnchorElem.click();
    });

    document.getElementById('inputRestore').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const importedData = JSON.parse(evt.target.result);
                if (Array.isArray(importedData)) {
                    historialArray = importedData;
                    localStorage.setItem('gasolinaHistorial', JSON.stringify(historialArray));
                    if (historialArray.length > 0) {
                        localStorage.setItem('kmMotoGuardado', historialArray[0].kf);
                        document.getElementById('ki').value = historialArray[0].kf;
                    }
                    sincronizarNube();
                    renderizarTabla();
                    actualizarGrafica();
                    alert("✅ Base de datos restaurada y sincronizada.");
                } else {
                    alert("❌ Formato de archivo inválido.");
                }
            } catch (err) {
                alert("❌ Error al procesar el archivo.");
            }
        };
        reader.readAsText(file);
    });

    // Exportaciones PDF/CSV
    document.getElementById('btnExportarPDF').addEventListener('click', () => window.print());

    document.getElementById('btnExportarCSV').addEventListener('click', () => {
        if (historialArray.length === 0) return alert("Base de datos vacía.");
        let csvContent = "data:text/csv;charset=utf-8,Referencia,Tipo Combustible,Odometro Inicial,Odometro Final,Distancia(km),Galones,Precio/Galon(Q),Monto Total(Q),Eficiencia(km/gal),Costo por KM(Q)\n";
        historialArray.forEach(r => {
            const precioCSV = r.precio || '0.00';
            const costoCSV = r.costo || (parseFloat(r.gal) * parseFloat(r.precio||0)).toFixed(2);
            const tipoCSV = r.tipoComb || 'Regular';
            csvContent += `"${r.fac}","${tipoCSV}",${r.ki},${r.kf},${r.recorrido},${r.gal},${precioCSV},${costoCSV},${r.rendimiento},${r.costoKm}\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "Reporte_Flotilla.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    // --- PWA: REGISTRO DE SERVICE WORKER FÍSICO ---
    // NOTA: Para que funcione sin internet, debes crear un archivo "sw.js" en GitHub 
    // con el código del Service Worker, ya que los virtuales se borran al cerrar la pestaña.
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Modo Offline Permanente Activo'))
                .catch(err => console.error('Error PWA', err));
        });
    }
</script>
</body>
</html>
