<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Gasolina</title>
    <meta name="theme-color" content="#dc2626">
    
    <!-- Manifest incrustado directamente para la PWA -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Control de Gasolina","short_name":"Gasolina","start_url":".","display":"standalone","background_color":"#f3f4f6","theme_color":"#dc2626","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3063/3063189.png","sizes":"512x512","type":"image/png"}]}'>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Paleta de colores más moderna y profesional */
        :root { 
            --primary: #dc2626; 
            --primary-hover: #b91c1c;
            --secondary: #1f2937; 
            --success: #10b981; 
            --success-hover: #059669;
            --info: #3b82f6; 
            --info-hover: #2563eb;
            --bg: #f3f4f6; 
            --surface: #ffffff; 
            --text-main: #111827; 
            --text-muted: #6b7280;
            --border: #e5e7eb; 
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0 0 40px; 
            -webkit-font-smoothing: antialiased;
        }

        /* Encabezado elegante */
        .app-header { 
            background: linear-gradient(135deg, var(--primary) 0%, #ef4444 100%);
            color: white; 
            padding: 24px 20px; 
            text-align: center; 
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2); 
            position: sticky; 
            top: 0; 
            z-index: 10; 
        }
        .app-header h1 { 
            margin: 0; 
            font-size: 1.5rem; 
            font-weight: 700; 
            letter-spacing: -0.025em;
        }

        .container { 
            max-width: 800px; 
            margin: 24px auto; 
            padding: 0 16px; 
        }

        /* Tarjetas con diseño limpio y sombra suave */
        .card { 
            background: var(--surface); 
            padding: 28px; 
            border-radius: var(--radius); 
            box-shadow: var(--shadow); 
            margin-bottom: 24px; 
            border: 1px solid rgba(255,255,255,0.1);
            transition: box-shadow 0.3s ease;
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
        }
        .card h2 { 
            color: var(--secondary); 
            margin-top: 0; 
            font-size: 1.25rem; 
            font-weight: 600;
            display: flex; 
            align-items: center; 
            gap: 10px; 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 16px; 
            margin-bottom: 24px; 
        }

        /* Campos de formulario modernos */
        .input-group { margin-bottom: 18px; }
        .input-group label { 
            display: block; 
            font-size: 0.875rem; 
            font-weight: 500; 
            color: var(--text-muted); 
            margin-bottom: 8px; 
        }
        .grid-2 { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 16px; 
        }
        input { 
            width: 100%; 
            padding: 14px 16px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-size: 1rem; 
            color: var(--text-main);
            background-color: #f9fafb; 
            box-sizing: border-box; 
            transition: all 0.2s ease; 
        }
        input::placeholder { color: #9ca3af; }
        input:focus { 
            border-color: var(--primary); 
            outline: none; 
            background-color: var(--surface);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
        }

        /* Botones con transiciones pulidas */
        button { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            font-size: 1rem; 
            font-weight: 600; 
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 8px; 
            transition: background-color 0.2s, transform 0.1s;
        }
        button:active { transform: translateY(1px); }
        
        .btn-calc { background-color: var(--info); }
        .btn-calc:hover { background-color: var(--info-hover); }
        
        .btn-guardar { background-color: var(--success); }
        .btn-guardar:hover { background-color: var(--success-hover); }
        
        .btn-pdf { background-color: var(--secondary); margin-top: 20px; }
        .btn-pdf:hover { background-color: #111827; }
        
        /* Botón de guardado pequeño arriba a la izquierda */
        .btn-guardar-small { 
            width: auto; 
            padding: 8px 16px; 
            font-size: 0.875rem; 
            display: inline-flex; 
            margin: 0 0 20px 0; 
            border-radius: 6px;
        }
        
        .btn-delete { 
            background-color: #fee2e2; 
            color: var(--primary); 
            padding: 8px 12px; 
            border-radius: 6px; 
            width: auto; 
            font-size: 1rem; 
        }
        .btn-delete:hover { background-color: #fecaca; }

        /* Alertas y resultados */
        .res-calc { 
            background: #eff6ff; 
            border-left: 4px solid var(--info); 
            padding: 16px; 
            border-radius: 0 8px 8px 0; 
            margin-top: 24px; 
            font-size: 0.95rem; 
            color: #1e3a8a; 
            line-height: 1.5;
        }
        .alert-text { color: var(--primary); font-weight: 700; display: block; margin-top: 8px; }

        /* Tabla más limpia y profesional */
        .table-wrapper { 
            overflow-x: auto; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            background: var(--surface);
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 0.875rem; 
            min-width: 700px; 
        }
        th, td { 
            padding: 14px 16px; 
            text-align: center; 
            border-bottom: 1px solid var(--border); 
        }
        th { 
            background: #f9fafb; 
            color: var(--text-muted); 
            font-weight: 600; 
            text-transform: uppercase; 
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }
        tbody tr { transition: background-color 0.2s; }
        tbody tr:hover { background-color: #f9fafb; }
        
        .badge { 
            background: #fee2e2; 
            color: var(--primary); 
            padding: 4px 10px; 
            border-radius: 9999px; /* Estilo píldora */
            font-weight: 600; 
            font-size: 0.8rem;
        }

        /* Estilos de Impresión para Exportar a PDF Limpio (INACTO) */
        @media print {
            body { background: white; padding: 0; }
            .card { box-shadow: none; border: none; margin-bottom: 0; padding: 10px; }
            .card:nth-child(1), .card:nth-child(2), .app-header { display: none !important; }
            button, .btn-pdf, .btn-delete { display: none !important; }
            .table-wrapper::before { content: "Historial de Rendimiento - Control de Gasolina"; font-size: 1.5rem; font-weight: bold; display: block; margin-bottom: 20px; text-align: center; color: black; }
            table { border: 1px solid black; }
            th, td { border: 1px solid #ccc; color: black; }
            .badge { background: none; color: black; border: 1px solid black; }
            th:last-child, td:last-child { display: none; }
        }
    </style>
</head>
<body>

<div class="app-header">
    <h1>Control de Gasolina</h1>
</div>

<div class="container">
    <!-- Calculadora -->
    <div class="card">
        <h2>🧭 Calculador De Gasolina</h2>
        <div class="grid-2">
            <div class="input-group">
                <label>KM a Recorrer</label>
                <input type="number" id="kmViaje" placeholder="Ej. 150">
            </div>
            <div class="input-group">
                <label>Precio Galón (Q)</label>
                <input type="number" id="precioGalon" placeholder="Ej. 30.50">
            </div>
        </div>
        <button class="btn-calc" id="btnCalcular">📊 Calcular Proyección</button>
        <div id="resultadoProyeccion" class="res-calc" style="display: none;"></div>
    </div>

    <!-- Nuevo Registro -->
    <div class="card">
        <!-- Botón de guardado ubicado arriba a la izquierda en pequeño -->
        <div style="text-align: left;">
            <button class="btn-guardar btn-guardar-small" id="btnGuardar">💾 Guardar Registro</button>
        </div>
        
        <h2>⛽ Nuevo Registro</h2>
        <div class="input-group">
            <label>No. Factura</label>
            <input type="text" id="f" placeholder="Opcional / Identificador">
        </div>
        <div class="grid-2">
            <div class="input-group">
                <label>KM Inicial</label>
                <input type="number" id="ki" placeholder="Ej. 5000">
            </div>
            <div class="input-group">
                <label>KM Final</label>
                <input type="number" id="kf" placeholder="Ej. 5200">
            </div>
        </div>
        <div class="grid-2">
            <div class="input-group">
                <label>Galones Cargados</label>
                <input type="number" id="gal" step="0.001" placeholder="Ej. 2.500">
            </div>
            <div class="input-group">
                <label>Costo Total (Q)</label>
                <input type="number" id="costo" step="0.01" placeholder="Ej. 75.00">
            </div>
        </div>
    </div>

    <!-- Historial -->
    <div class="card">
        <h2>📋 Historial de Rendimiento</h2>
        <div class="table-wrapper">
            <table id="tablaHistorial">
                <thead>
                    <tr>
                        <th>Fac.</th>
                        <th>KM Inic.</th>
                        <th>KM Fin.</th>
                        <th>Recorrido</th>
                        <th>Galones</th>
                        <th>Rend.(km/gal)</th>
                        <th>Costo/KM</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="bodyHistorial">
                    <!-- Registros dinámicos -->
                </tbody>
            </table>
        </div>
        <button class="btn-pdf" id="btnExportarPDF">📄 Exportar a PDF</button>
    </div>
</div>

<script>
    // Lógica de la calculadora de proyecciones
    document.getElementById('btnCalcular').addEventListener('click', () => {
        const km = parseFloat(document.getElementById('kmViaje').value);
        const precio = parseFloat(document.getElementById('precioGalon').value);
        const res = document.getElementById('resultadoProyeccion');
        
        if (km && precio) {
            const galonesEstimados = km / 40; // Rendimiento estimado base de 40 km/gal
            const costoEstimado = galonesEstimados * precio;
            res.style.display = 'block';
            res.innerHTML = `Para <b>${km} km</b> necesitarás aprox. <b>${galonesEstimados.toFixed(2)} galones</b>.<br><span class="alert-text">Costo Estimado: Q${costoEstimado.toFixed(2)}</span>`;
        }
    });

    // Guardado de registro y actualización del historial
    document.getElementById('btnGuardar').addEventListener('click', () => {
        const fac = document.getElementById('f').value || '-';
        const ki = parseFloat(document.getElementById('ki').value);
        const kf = parseFloat(document.getElementById('kf').value);
        const gal = parseFloat(document.getElementById('gal').value);
        const costo = parseFloat(document.getElementById('costo').value);

        if (ki && kf && gal && costo && kf > ki) {
            const recorrido = kf - ki;
            const rendimiento = recorrido / gal;
            const costoKm = costo / recorrido;

            const tbody = document.getElementById('bodyHistorial');
            const tr = document.createElement('tr');
            
            tr.innerHTML = `
                <td>${fac}</td>
                <td>${ki}</td>
                <td>${kf}</td>
                <td>${recorrido}</td>
                <td>${gal.toFixed(2)}</td>
                <td>${rendimiento.toFixed(2)}</td>
                <td><span class="badge">Q${costoKm.toFixed(2)}</span></td>
                <td><button class="btn-delete" onclick="this.parentElement.parentElement.remove()">🗑️</button></td>
            `;
            
            tbody.prepend(tr); 
            
            // Limpia los campos dejando el KM final como el nuevo KM inicial
            document.getElementById('f').value = '';
            document.getElementById('ki').value = kf;
            document.getElementById('kf').value = '';
            document.getElementById('gal').value = '';
            document.getElementById('costo').value = '';
        } else {
            alert("Por favor verifica los datos. El KM Final debe ser mayor al Inicial.");
        }
    });

    // Función para Exportar a PDF (Usa la herramienta del navegador)
    document.getElementById('btnExportarPDF').addEventListener('click', () => {
        window.print(); 
    });

    // Activación del Modo Offline (Service Worker inyectado mediante un Blob)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            const swCode = `
                const CACHE_NAME = 'gasolina-cache-v2';
                self.addEventListener('install', event => {
                    event.waitUntil(
                        caches.open(CACHE_NAME).then(cache => {
                            return cache.addAll([location.href.split('#')[0].split('?')[0]]);
                        })
                    );
                });
                self.addEventListener('fetch', event => {
                    event.respondWith(
                        caches.match(event.request).then(response => {
                            return response || fetch(event.request);
                        })
                    );
                });
            `;
            
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            
            navigator.serviceWorker.register(swUrl)
                .then(reg => console.log('Modo sin conexión activado correctamente.'))
                .catch(err => console.error('Error al iniciar modo offline.', err));
        });
    }
</script>
</body>
</html>
