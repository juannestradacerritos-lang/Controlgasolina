<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Gasolina</title>
    <meta name="theme-color" content="#dc2626">
    
    <!-- Manifest incrustado directamente para la PWA -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Control de Gasolina","short_name":"Gasolina","start_url":".","display":"standalone","background_color":"#f8fafc","theme_color":"#dc2626","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3063/3063189.png","sizes":"512x512","type":"image/png"}]}'>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #dc2626; --secondary: #1e293b; --success: #16a34a; --info: #0284c7; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; }
        body { font-family: Inter, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0 0 40px; }
        .app-header { background-color: var(--primary); color: white; padding: 20px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 10; }
        .app-header h1 { margin: 0; font-size: 1.5rem; font-weight: 700; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .card { background: var(--surface); padding: 24px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 24px; border: 1px solid var(--border); }
        .card h2 { color: var(--secondary); margin-top: 0; font-size: 1.25rem; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--bg); padding-bottom: 12px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #64748b; margin-bottom: 6px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; background-color: var(--bg); box-sizing: border-box; transition: border 0.3s; }
        input:focus { border-color: var(--primary); outline: none; background-color: var(--surface); }
        button { width: 100%; padding: 16px; border: none; border-radius: 12px; color: white; font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
        button:active { transform: scale(0.97); }
        .btn-calc { background-color: var(--info); margin-top: 10px; }
        .btn-guardar { background-color: var(--success); }
        
        /* Ajuste específico para el botón de guardado: pequeño y arriba a la izquierda */
        .btn-guardar-small { width: auto; padding: 6px 12px; font-size: 0.8rem; display: inline-flex; margin: 0 0 15px 0; }
        
        .btn-delete { background-color: #fee2e2; color: var(--primary); padding: 8px 12px; border-radius: 8px; width: auto; font-size: 1rem; }
        .res-calc { background: #eff6ff; border-left: 4px solid var(--info); padding: 15px; border-radius: 8px; margin-top: 20px; font-size: 0.95rem; color: #1e3a8a; }
        .alert-text { color: var(--primary); font-weight: bold; display: block; margin-top: 8px; }
        .table-wrapper { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 650px; }
        th, td { padding: 12px 10px; text-align: center; border-bottom: 1px solid var(--border); }
        th { background: var(--bg); color: var(--secondary); font-weight: 700; text-transform: uppercase; }
        .badge { background: var(--primary); color: white; padding: 4px 8px; border-radius: 6px; font-weight: 700; }
    </style>
</head>
<body>

<div class="app-header">
    <h1>Control de Gasolina</h1>
</div>

<div class="container">
    <!-- Calculadora -->
    <div class="card">
        <h2>🧭 Calculadora de Viaje</h2>
        <div class="grid-2">
            <div class="input-group">
                <label>KM a Recorrer</label>
                <input type="number" id="kmViaje" placeholder="Ej. 150">
            </div>
            <div class="input-group">
                <label>Precio Galón (Q)</label>
                <input type="number" id="precioGalon" placeholder="Ej. 30.50">
            </div>
        </div>
        <button class="btn-calc" id="btnCalcular">📊 Calcular Proyección</button>
        <div id="resultadoProyeccion" class="res-calc" style="display: none;"></div>
    </div>

    <!-- Nuevo Registro -->
    <div class="card">
        <!-- Botón de guardado ubicado arriba a la izquierda en pequeño -->
        <div style="text-align: left;">
            <button class="btn-guardar btn-guardar-small" id="btnGuardar">💾 Guardar Registro</button>
        </div>
        
        <h2>⛽ Nuevo Registro</h2>
        <div class="input-group">
            <label>No. Factura</label>
            <input type="text" id="f" placeholder="Opcional / Identificador">
        </div>
        <div class="grid-2">
            <div class="input-group">
                <label>KM Inicial</label>
                <input type="number" id="ki" placeholder="Ej. 5000">
            </div>
            <div class="input-group">
                <label>KM Final</label>
                <input type="number" id="kf" placeholder="Ej. 5200">
            </div>
        </div>
        <div class="grid-2">
            <div class="input-group">
                <label>Galones Cargados</label>
                <input type="number" id="gal" step="0.001" placeholder="Ej. 2.500">
            </div>
            <div class="input-group">
                <label>Costo Total (Q)</label>
                <input type="number" id="costo" step="0.01" placeholder="Ej. 75.00">
            </div>
        </div>
    </div>

    <!-- Historial -->
    <div class="card">
        <h2>📋 Historial de Rendimiento</h2>
        <div class="table-wrapper">
            <table id="tablaHistorial">
                <thead>
                    <tr>
                        <th>Fac.</th>
                        <th>KM Inic.</th>
                        <th>KM Fin.</th>
                        <th>Recorrido</th>
                        <th>Galones</th>
                        <th>Rend.(km/gal)</th>
                        <th>Costo/KM</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="bodyHistorial">
                    <!-- Registros dinámicos -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Lógica de la calculadora de proyecciones
    document.getElementById('btnCalcular').addEventListener('click', () => {
        const km = parseFloat(document.getElementById('kmViaje').value);
        const precio = parseFloat(document.getElementById('precioGalon').value);
        const res = document.getElementById('resultadoProyeccion');
        
        if (km && precio) {
            const galonesEstimados = km / 40; // Rendimiento estimado base de 40 km/gal
            const costoEstimado = galonesEstimados * precio;
            res.style.display = 'block';
            res.innerHTML = `Para <b>${km} km</b> necesitarás aprox. <b>${galonesEstimados.toFixed(2)} galones</b>.<br><span class="alert-text">Costo Estimado: Q${costoEstimado.toFixed(2)}</span>`;
        }
    });

    // Guardado de registro y actualización del historial
    document.getElementById('btnGuardar').addEventListener('click', () => {
        const fac = document.getElementById('f').value || '-';
        const ki = parseFloat(document.getElementById('ki').value);
        const kf = parseFloat(document.getElementById('kf').value);
        const gal = parseFloat(document.getElementById('gal').value);
        const costo = parseFloat(document.getElementById('costo').value);

        if (ki && kf && gal && costo && kf > ki) {
            const recorrido = kf - ki;
            const rendimiento = recorrido / gal;
            const costoKm = costo / recorrido;

            const tbody = document.getElementById('bodyHistorial');
            const tr = document.createElement('tr');
            
            tr.innerHTML = `
                <td>${fac}</td>
                <td>${ki}</td>
                <td>${kf}</td>
                <td>${recorrido}</td>
                <td>${gal.toFixed(2)}</td>
                <td>${rendimiento.toFixed(2)}</td>
                <td><span class="badge">Q${costoKm.toFixed(2)}</span></td>
                <td><button class="btn-delete" onclick="this.parentElement.parentElement.remove()">🗑️</button></td>
            `;
            
            tbody.prepend(tr); // Agrega el registro en la parte superior de la tabla
            
            // Limpia los campos dejando el KM final como el nuevo KM inicial
            document.getElementById('f').value = '';
            document.getElementById('ki').value = kf;
            document.getElementById('kf').value = '';
            document.getElementById('gal').value = '';
            document.getElementById('costo').value = '';
        } else {
            alert("Por favor verifica los datos. El KM Final debe ser mayor al Inicial.");
        }
    });

    // Activación del Modo Offline (Service Worker inyectado mediante un Blob)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            const swCode = `
                const CACHE_NAME = 'gasolina-cache-v1';
                self.addEventListener('install', event => {
                    event.waitUntil(
                        caches.open(CACHE_NAME).then(cache => {
                            // Almacena la URL actual para que cargue sin internet
                            return cache.addAll([location.href.split('#')[0].split('?')[0]]);
                        })
                    );
                });
                self.addEventListener('fetch', event => {
                    event.respondWith(
                        caches.match(event.request).then(response => {
                            return response || fetch(event.request);
                        })
                    );
                });
            `;
            
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            
            navigator.serviceWorker.register(swUrl)
                .then(reg => console.log('Modo sin conexión activado correctamente.'))
                .catch(err => console.error('Error al iniciar modo offline.', err));
        });
    }
</script>
</body>
</html>
